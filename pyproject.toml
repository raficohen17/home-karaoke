[project]
name = "home-karaoke"
version = "0.1.0"
description = "Local karaoke: AI stem separation, synced Hebrew/English lyrics, TV + phone remote (educational experiment)"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "audio-separator[cpu]>=0.48.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.165.0",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "numpy>=2.4.6",
    "qrcode[pil]>=8.2",
    "soundfile>=0.14.0",
    "stable-ts>=2.19.1",
    "syncedlyrics>=1.0.1",
    "torchaudio>=2.9",
    "transformers>=4.50",
    "truststore>=0.10.5",
    "uvicorn[standard]>=0.54.0",
    "yt-dlp>=2026.11.23",
    "yt-dlp-ejs>=0.8.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
